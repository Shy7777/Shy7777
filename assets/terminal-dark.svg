<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
  <title id="title">Shy — personal AI lab</title>
  <desc id="desc">A terminal introduces Shy, an AI graduate student at UCAS. Exploring AI. Building things I want to use.</desc>
  <defs>
    <clipPath id="terminal-corners">
      <rect x="1" y="1" width="998" height="348" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#terminal-corners)">
    <rect width="1000" height="350" fill="#0d1117"/>
    <rect width="1000" height="55" fill="#161b22"/>
    <path d="M0 55H1000" stroke="#30363d"/>
  </g>
  <rect x="1" y="1" width="998" height="348" rx="16" fill="none" stroke="#30363d" stroke-width="2"/>
  <g fill="#59636e">
    <circle cx="30" cy="28" r="5"/>
    <circle cx="49" cy="28" r="5"/>
    <circle cx="68" cy="28" r="5"/>
  </g>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
    <text x="500" y="34" text-anchor="middle" fill="#919aa6" font-size="16">Shy7777 / personal lab</text>
    <text x="40" y="108" fill="#f0f6fc" font-size="28"><tspan fill="#59dfa7">shy@lab:~ $</tspan><tspan dx="14" fill="#f0f6fc">whoami</tspan></text>
    <text x="40" y="179" fill="#f0f6fc" font-size="64" font-weight="700" letter-spacing="-2">Shy</text>
    <text x="42" y="222" fill="#f0f6fc" font-size="34">AI graduate student @ UCAS</text>
    <text x="42" y="273" fill="#919aa6" font-size="34">Exploring AI. Building things I want to use.</text>
    <text x="40" y="324" fill="#59dfa7" font-size="24">$</text>
  </g>
  <rect x="68" y="305" width="12" height="23" rx="1" fill="#59dfa7"/>
</svg>
