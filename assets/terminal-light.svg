<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
  <title id="title">Shy — personal AI lab</title>
  <desc id="desc">A terminal introduces Shy, an AI graduate student at UCAS. Exploring AI. Building things I want to use.</desc>
  <defs>
    <clipPath id="terminal-corners">
      <rect x="1" y="1" width="998" height="348" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#terminal-corners)">
    <rect width="1000" height="350" fill="#ffffff"/>
    <rect width="1000" height="55" fill="#f6f8fa"/>
    <path d="M0 55H1000" stroke="#d1d9e0"/>
  </g>
  <rect x="1" y="1" width="998" height="348" rx="16" fill="none" stroke="#d1d9e0" stroke-width="2"/>
  <g fill="#8c959f">
    <circle cx="30" cy="28" r="5"/>
    <circle cx="49" cy="28" r="5"/>
    <circle cx="68" cy="28" r="5"/>
  </g>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
    <text x="500" y="34" text-anchor="middle" fill="#59636e" font-size="16">Shy7777 / personal lab</text>
    <text x="40" y="108" fill="#1f2328" font-size="28"><tspan fill="#137b50">shy@lab:~ $</tspan><tspan dx="14" fill="#1f2328">whoami</tspan></text>
    <text x="40" y="179" fill="#1f2328" font-size="64" font-weight="700" letter-spacing="-2">Shy</text>
    <text x="42" y="222" fill="#1f2328" font-size="34">AI graduate student @ UCAS</text>
    <text x="42" y="273" fill="#59636e" font-size="34">Exploring AI. Building things I want to use.</text>
    <text x="40" y="324" fill="#137b50" font-size="24">$</text>
  </g>
  <rect x="68" y="305" width="12" height="23" rx="1" fill="#137b50"/>
</svg>
